########################
#      PLUGINS         #
########################

# prefix + I to install, prefix + U to update
set -g @plugin 'tmux-plugins/tpm'
# prefix + Ctrl-s to save, prefix + Ctrl-r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'


########################
#      GENERAL         #
########################

# set-option -g prefix M
setw -g mouse on
set -g set-clipboard external

# allow true colours
# set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# use vi bindings in copy mode & status line
set -g mode-keys vi
set -g status-keys vi

# changes window colour when activity detected
setw -g monitor-activity on

# amount of entries viewable when scrolling up
set -g history-limit 50000

# refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# stop esc key being used, helps with vim
set -s escape-time 0

# focus events enabled for terminals that support them
set -g focus-events on

# stops prefix being active after inputting command
set -g repeat-time 0


########################
#      STATUS BAR      #
########################

# positioning
set-option -g status-position top
set-option -g status-justify centre

# status information
set -g status-left "#{?client_prefix,#[bg=white]#[fg=black],} #S "
set -g status-left-length 60
set -g status-right " "
set -g status-right-length 60

# format
set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format " #I: #W "

# colours
set-option -g status-style 'bg=colour236,fg=white'
set-window-option -g window-status-style bg=colour236,fg=white
# set-window-option -g window-status-current-style bg=colour202,fg=black
set-window-option -g window-status-current-style bg=colour41,fg=black
set-window-option -g window-status-separator '  '


########################
#      WINDOW STYLE    #
########################

set-option -ag pane-active-border-style fg=white
set-option -g pane-border-style fg=colour236


########################
#      KEY BINDINGS    #
########################

# reload tmux config
bind r source-file ~/.tmux.conf

# vim-like pane switching
bind -r h select-pane -L
bind -r j select-pane -U
bind -r k select-pane -D
bind -r l select-pane -R

# switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# resize panes
bind-key -n M-Left resize-pane -L 5
bind-key -n M-Down resize-pane -D 5
bind-key -n M-Up resize-pane -U 5
bind-key -n M-Right resize-pane -R 5

########################
#      FINAL           #
########################

# automatically install tpm & plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
