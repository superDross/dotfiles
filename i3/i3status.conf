# i3status configuration file.

# copy character in brackets (　) and use as space between symbol and text


general {
        colors = true
        # color_good = "#0ae574"
        color_good = "#c4fcf0"
        color_bad = "#ff8205"
        color_degraded = "#7e7e7f"
        interval = 5
}

# order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "cpu_usage"
order += "cpu_temperature all"
order += "disk /"
order += "volume_master"
order += "battery all"
order += "tztime local"

wireless _first_ {
        format_up = "　%ip  |  　%essid:%quality"
        format_down = ""
        separator_block_width = 25
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        format_up = "　%ip  |  　%speed"
        format_down = ""
        separator_block_width = 25
}

battery all {
        format = "%status　%percentage %remaining "
        status_bat = ""
        status_chr = ""
        status_full = ""
        threshold_type = "percentage"
        low_threshold = 30
        hide_seconds = true
        integer_battery_capacity = true
        separator_block_width = 25
}

tztime local {
        format = "　%d-%b  %H:%M  "
        separator_block_width = 25
}

load {
        format = "%1min"
        separator_block_width = 25
}

cpu_usage {
	      format = "　%usage%"
        max_threshold = 80
        separator_block_width = 25
}

cpu_temperature all {
        format = "　%degrees °C"
        format_above_threshold = "　%degrees °C"
        max_threshold = 75
        path = "/sys/devices/platform/coretemp.0/hwmon/hwmon*/temp1_input"
        separator_block_width = 25
}

disk "/" {
        format = "　%avail"
        threshold_type = "percentage_free"
        low_threshold = 10
        separator_block_width = 25
}

# does not work for IPSec
path_exists VPN {
     # path exists when a VPN tunnel launched by nmcli/nm-applet is active
     format = ""
     format_down = ""
     path = "/proc/sys/net/ipv4/conf/tun0"
     separator_block_width = 25
}

volume master {
        format = "♪　%volume"
        format_muted = "♪ muted (%volume)"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
        separator_block_width = 25
}
